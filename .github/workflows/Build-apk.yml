name: Build DD Alert Watcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DD_Alert_Watcher_Pure_v1.1.8_Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf _src
          mkdir _src
          unzip -q DD_Alert_Watcher_Pure_v1.1.8_Source.zip -d _src
          test -f _src/DD_Alert_Watcher_Pure_v1.1.8_Source/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: _src/DD_Alert_Watcher_Pure_v1.1.8_Source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp _src/DD_Alert_Watcher_Pure_v1.1.8_Source/app/build/outputs/apk/debug/app-debug.apk \
             DD-Alert-Watcher-Pure-v1.1.8-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Alert-Watcher-Pure-v1.1.8-debug
          path: DD-Alert-Watcher-Pure-v1.1.8-debug.apk
          if-no-files-found: error
          retention-days: 7
