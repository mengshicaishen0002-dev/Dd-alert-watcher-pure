name: Build DD Alert Watcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q DD_Alert_Watcher_Pure_v1.1.7.1_HandledOfferFix_Source.zip -d source
          echo "ZIP extracted successfully"

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname $(find source -name settings.gradle -type f | head -1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK found at: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Alert-Watcher-Pure-v1.1.7.1
          path: ${{ env.APK_PATH }}
