name: Build DD Alert Watcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the only source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE source ZIP in repository root."
            printf 'Found: %s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "SOURCE_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"
          echo "Using source ZIP: ${ZIPS[0]}"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find source -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find source
